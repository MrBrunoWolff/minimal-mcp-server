name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails the build on a high or critical advisory. The release-age gate in
      # bunfig slows a malicious package down; this is what notices a known one.
      - name: Audit
        run: bun run audit

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Test server functionality
        run: bun run test:server

  publish:
    name: Publish to npm
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Trusted publishing (OIDC): npm verifies this workflow's identity against
    # the trusted publisher configured on the package, so there is no token to
    # store, leak or rotate — and no 2FA prompt to get stuck behind. `id-token`
    # is what lets the runner mint the OIDC token; without it npm falls back to
    # looking for a credential and fails.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      # npm drives the publish, not bun: trusted publishing is an npm CLI feature
      # and `bun publish` has no OIDC support, so this step stays on npm even
      # though everything else in this repo runs on bun.
      - name: Setup Node.js for npm publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1. Node 24 already ships a newer
      # npm than that, but pinning the floor explicitly means a future runner
      # image change cannot silently drop OIDC support and fall back to asking
      # for a credential.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version) / node $(node --version)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish to npm (if version changed)
        run: |
          # No NODE_AUTH_TOKEN here on purpose. With a trusted publisher
          # configured on npm, the CLI exchanges this job's OIDC identity for a
          # short-lived credential itself; supplying a token would bypass that
          # and lose the provenance attestation npm generates automatically.
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          # Trusted publishing cannot perform a package's *first* publish: npm
          # requires the package to exist before a trusted publisher can be
          # configured on it (unlike PyPI). Until that one-time bootstrap has
          # happened there is nothing this job can usefully do, so skip rather
          # than fail — otherwise every push to main is red for a reason that
          # has nothing to do with the code.
          if ! npm view "$PACKAGE_NAME" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME does not exist on npm yet."
            echo "Trusted publishing cannot create it — publish once manually, then"
            echo "configure the trusted publisher (repo: this one, workflow: ci.yml)."
            exit 0
          fi

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION already exists, skipping publish"
            exit 0
          fi

          echo "Publishing $PACKAGE_NAME@$PACKAGE_VERSION via trusted publishing"
          npm publish
